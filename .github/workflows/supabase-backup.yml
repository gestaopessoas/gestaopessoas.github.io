name: Supabase Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *" # 03:00 BRT (06:00 UTC)

permissions:
  contents: read

concurrency:
  group: supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # O dump NÃO é commitado: este repositório é público e os dumps contêm
      # dados pessoais de produção. Vai como artifact, visível só para quem
      # tem acesso ao repo.
      - name: Dump roles, schema e dados
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backups
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backups/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backups/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backups/data.sql --data-only --use-copy

      - name: Conferir que os dumps não vieram vazios
        run: |
          for f in backups/schema.sql backups/data.sql; do
            if [ ! -s "$f" ]; then
              echo "::error::$f está vazio — backup falhou silenciosamente"
              exit 1
            fi
          done
          wc -l backups/*.sql

      - name: Publicar artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-backup-${{ github.run_id }}
          path: backups/
          retention-days: 30
          if-no-files-found: error
